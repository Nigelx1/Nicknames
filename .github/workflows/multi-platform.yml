name: Multi-platform build

# Builds Nicknames for every platform Geode runs on (Windows, macOS, iOS,
# Android 64 and 32-bit) and packages one .geode with all five binaries.
# Modeled on GucciBot's workflow: same matrix, same pinned bindings, same
# actions. mod.json declares every platform itself, since the combine step
# keeps one job's mod.json.

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest, target: Win64 }
          - { name: macOS, os: macos-latest, target: MacOS }
          - { name: iOS, os: macos-latest, target: iOS }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
          - { name: Android32, os: ubuntu-latest, target: Android32 }

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          # The bindings commit CMakeLists.txt pins for local builds (and the
          # one GucciBot builds with); move both together.
          bindings-ref: d641858f3e1cd2c6d86013c799f224ebdb8ec1cd

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Nicknames (all platforms)
          path: ${{ steps.build.outputs.build-output }}
